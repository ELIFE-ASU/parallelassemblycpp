name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: assemblycpp-v5
          environment-file: environment.yml
          miniforge-version: latest
          channel-priority: strict
          conda-remove-defaults: true

      - name: Audit test data
        run: python unitTests/unitTester.py --audit

      - name: Test benchmark tooling
        run: |
          python -m unittest discover -s benchmarks -p 'test_*.py'
          python benchmarks/benchmark.py --list-cases

      - name: Build and run regression suite
        timeout-minutes: 30
        run: python unitTests/unitTester.py --build --jobs 2 --timeout 120
