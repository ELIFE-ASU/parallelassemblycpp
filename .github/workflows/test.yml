name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure with Clang
        run: >
          cmake -S . -B build/clang -G Ninja
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DASSEMBLYCPP_BUILD_TELEMETRY=ON
          -DASSEMBLYCPP_FULL_REGRESSION_TESTS=OFF
          -DASSEMBLYCPP_STRICT_WARNINGS=ON

      - name: Build with Clang
        run: cmake --build build/clang --parallel 2

      - name: Test Clang unit targets
        run: >
          ctest --test-dir build/clang --output-on-failure
          --no-tests=error -L unit

      - name: Smoke-test Clang CLI
        run: build/clang/AssemblyCpp --help

  strict-msvc:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure with MSVC
        run: >
          cmake -S . -B build/msvc -G "Visual Studio 17 2022" -A x64
          -DBUILD_TESTING=ON
          -DASSEMBLYCPP_BUILD_TELEMETRY=ON
          -DASSEMBLYCPP_BUILD_OPENMP=ON
          -DASSEMBLYCPP_FULL_REGRESSION_TESTS=OFF
          -DASSEMBLYCPP_STRICT_WARNINGS=ON

      - name: Build with MSVC
        run: cmake --build build/msvc --config Release --parallel 2

      - name: Test MSVC unit targets
        run: >
          ctest --test-dir build/msvc -C Release --output-on-failure
          --no-tests=error -L unit

      - name: Smoke-test MSVC CLI
        run: |
          & .\build\msvc\Release\AssemblyCpp.exe --help
          & .\build\msvc\Release\AssemblyCppOMP.exe --help

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el -o pipefail {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Create Conda environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: assemblycpp-v5
          environment-file: environment.yml
          miniforge-version: latest
          channel-priority: strict
          conda-remove-defaults: true

      - name: Check repository style
        run: |
          ruff format --check .
          ruff check .
          python tools/check_repository.py

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        timeout-minutes: 30
        run: ctest --preset ci

      - name: Configure parallel correctness tests
        run: cmake --preset parallel-tests

      - name: Build parallel correctness tests
        run: cmake --build --preset parallel-tests

      - name: Test OpenMP, MPI, hybrid, and telemetry modes
        timeout-minutes: 10
        run: ctest --preset parallel-tests

      - name: Build portable package candidate
        run: |
          CXX=/usr/bin/g++ CXXFLAGS= LDFLAGS= cmake --preset release
          cmake --build --preset release

      - name: Verify staged install
        run: |
          cmake --install build/release --prefix build/stage
          build/stage/bin/AssemblyCpp --help
          test -f build/stage/include/assemblycpp/assemblycpp.h
          test -f build/stage/lib/libassemblycpp.a
          test -f build/stage/lib/cmake/AssemblyCpp/AssemblyCppConfig.cmake
          if readelf -d build/stage/bin/AssemblyCpp | grep -Eq '\((RPATH|RUNPATH)\)'; then
            echo 'error: staged executable contains an RPATH or RUNPATH' >&2
            exit 1
          fi
          if readelf -n build/stage/bin/AssemblyCpp | grep -Eq 'x86-64-v[234]'; then
            echo 'error: portable executable requires an x86-64 microarchitecture level' >&2
            exit 1
          fi
          if ldd build/stage/bin/AssemblyCpp | grep -Fq "$CONDA_PREFIX"; then
            echo 'error: staged executable resolves a runtime from Conda' >&2
            exit 1
          fi
          python unitTests/unitTester.py build/stage/bin/AssemblyCpp --limit 20

      - name: Verify binary and source packaging
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          cpack --config build/release/CPackConfig.cmake -B build/packages
          cpack --config build/release/CPackSourceConfig.cmake -B build/packages
          (
            cd build/packages
            sha256sum -c ./*.sha256
          )
          archive=$(find build/packages -maxdepth 1 -name '*-portable.tar.gz' -print -quit)
          test -n "$archive"
          if ! tar --numeric-owner -tvzf "$archive" | awk '$2 != "0/0" { exit 1 }'; then
            echo 'error: binary package ownership is not normalized' >&2
            exit 1
          fi
          if ! tar -tvzf "$archive" | awk '
            BEGIN { bad = 0 }
            $1 ~ /^d/ && $1 != "drwxr-xr-x" { bad = 1 }
            $1 ~ /^-/ && $NF ~ /\/bin\/AssemblyCpp$/ && $1 != "-rwxr-xr-x" { bad = 1 }
            $1 ~ /^-/ && $NF !~ /\/bin\/AssemblyCpp$/ && $1 != "-rw-r--r--" { bad = 1 }
            END { exit bad }
          '; then
            echo 'error: binary package permissions are not normalized' >&2
            exit 1
          fi
          cmake -E make_directory build/package-smoke
          cmake -E chdir build/package-smoke cmake -E tar xzf "$GITHUB_WORKSPACE/$archive"
          packaged_executable=$(find build/package-smoke -type f -path '*/bin/AssemblyCpp' -print -quit)
          test -n "$packaged_executable"
          "$packaged_executable" --help
          if readelf -d "$packaged_executable" | grep -Eq '\((RPATH|RUNPATH)\)'; then
            echo 'error: packaged executable contains an RPATH or RUNPATH' >&2
            exit 1
          fi
          if readelf -n "$packaged_executable" | grep -Eq 'x86-64-v[234]'; then
            echo 'error: packaged executable requires an x86-64 microarchitecture level' >&2
            exit 1
          fi
          test "$(stat -c '%a' "$packaged_executable")" = 755
          python unitTests/unitTester.py "$packaged_executable" --limit 20

          source_archive=$(find build/packages -maxdepth 1 -name '*-source.tar.gz' -print -quit)
          test -n "$source_archive"
          if ! tar --numeric-owner -tvzf "$source_archive" | awk '$2 != "0/0" { exit 1 }'; then
            echo 'error: source package ownership is not normalized' >&2
            exit 1
          fi
          if ! tar -tvzf "$source_archive" | awk '
            BEGIN { bad = 0 }
            $1 ~ /^d/ && $1 != "drwxr-xr-x" { bad = 1 }
            $1 ~ /^-/ && $NF ~ /\/output\/benchmarks\/.*\/run_benchmark.py$/ && $1 != "-rwxr-xr-x" { bad = 1 }
            $1 ~ /^-/ && $NF !~ /\/output\/benchmarks\/.*\/run_benchmark.py$/ && $1 != "-rw-r--r--" { bad = 1 }
            END { exit bad }
          '; then
            echo 'error: source package permissions are not normalized' >&2
            exit 1
          fi
          cmake -E make_directory build/source-package-smoke
          cmake -E chdir build/source-package-smoke cmake -E tar xzf "$GITHUB_WORKSPACE/$source_archive"
          source_root=$(find build/source-package-smoke -mindepth 1 -maxdepth 1 -type d -name 'assemblycpp-*-source' -print -quit)
          test -n "$source_root"
          test -f "$source_root/CMakeLists.txt"
          test -f "$source_root/CMakePresets.json"
          test -f "$source_root/License.md"
          test ! -e "$source_root/.git"
          test ! -e "$source_root/.agents"
          test ! -e "$source_root/.codex"
          test ! -e "$source_root/build"
          writable_path=$(find "$source_root" -mindepth 1 -perm /022 -print -quit)
          if [[ -n "$writable_path" ]]; then
            echo 'error: source package contains group- or world-writable paths' >&2
            exit 1
          fi
          generated_output=$(find "$source_root/unitTests" -maxdepth 1 -type f \( -name '*Out' -o -name '*Pathway' -o -name '*MAs' -o -name '*Telemetry.json' \) -print -quit)
          if [[ -n "$generated_output" ]]; then
            echo 'error: source package contains generated test output' >&2
            exit 1
          fi
          cmake -E chdir "$source_root" ruff format --check .
          cmake -E chdir "$source_root" ruff check .
          python "$source_root/tools/check_repository.py"
          python "$source_root/unitTests/unitTester.py" --audit
          CXX=/usr/bin/g++ CXXFLAGS= LDFLAGS= cmake -E chdir "$source_root" cmake --preset release
          cmake -E chdir "$source_root" cmake --build --preset release
