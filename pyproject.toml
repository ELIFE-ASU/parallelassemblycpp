[tool.ruff]
target-version = "py310"
line-length = 88
extend-exclude = ["build"]

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "DJ",
  "DTZ",
  "E",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FLY",
  "FURB",
  "G",
  "I",
  "ICN",
  "INT",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PIE",
  "PLC",
  "PLE",
  "PLR0124",
  "PLR0133",
  "PLW",
  "PGH",
  "PTH",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "TC",
  "TID",
  "TRY004",
  "UP",
  "W",
  "YTT",
]

[tool.ruff.lint.isort]
known-first-party = ["benchmarks"]

[tool.ruff.lint.per-file-ignores]
# These command-line harnesses intentionally execute explicitly selected tools.
"benchmarks/benchmark.py" = ["S603"]
"unitTests/parallelSolverTester.py" = ["S603"]
"unitTests/unitTester.py" = ["S603"]
"output/benchmarks/*/run_benchmark.py" = ["E501", "S603", "S607"]
"tools/check_repository.py" = ["S603"]
# Assertions are appropriate inside the unittest regression suites.
"benchmarks/test_*.py" = ["S101"]
